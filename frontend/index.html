<!DOCTYPE html>
<html lang="es-PE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Virtual | Movistar Perú</title>
    <link rel="stylesheet" href="./chat.css">
</head>
<body>

    <!-- SIDEBAR TIPO GEMINI CON MARCA MOVISTAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="./logo.png" alt="Movistar Logo" class="brand-logo">
            <div class="brand-info">
                <span class="brand-title">Movistar</span>
                <span class="brand-subtitle">Asistente Virtual</span>
            </div>
        </div>

        <button class="btn-new-chat" id="newChatButton">
            <span class="icon">+</span> Nueva consulta
        </button>

        <div class="sidebar-menu">
            <div class="menu-label">Consultas frecuentes</div>
            <button class="menu-item" onclick="sendQuickPrompt('¿Cuáles son los planes de fibra óptica?')">
                📶 Planes Fibra Óptica
            </button>
            <button class="menu-item" onclick="sendQuickPrompt('¿Cómo consulto mi recibo o estado de cuenta?')">
                📄 Consultar Recibo
            </button>
            <button class="menu-item" onclick="sendQuickPrompt('Tengo problemas con la velocidad de mi internet')">
                🛠️ Soporte Técnico
            </button>
            <button class="menu-item" onclick="sendQuickPrompt('Quiero hablar con un asesor')">
                👤 Hablar con un asesor
            </button>
        </div>

        <div class="sidebar-footer">
            <div class="timer-card">
                <span class="timer-title">Tiempo de sesión</span>
                <span id="chatTimer" class="timer-clock">10:00</span>
            </div>
        </div>
    </aside>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="chat-container">
        
        <!-- HEADER TOPBAR -->
        <header class="chat-topbar">
            <div class="topbar-left">
                <button class="btn-toggle-sidebar" id="toggleSidebar" title="Menú">☰</button>
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span>En línea • Respuestas con IA</span>
                </div>
            </div>
            <div class="topbar-right">
                <span class="user-badge">Atención al Cliente</span>
            </div>
        </header>

        <!-- ÁREA DE MENSAJES CON SCROLL CORREGIDO -->
        <section class="chat-messages-wrapper" id="chatWrapper">
            <div class="chat-messages" id="chatMessages">
                <!-- Los mensajes se inyectan dinámicamente -->
            </div>
        </section>

        <!-- ENTRADA DE TEXTO ESTILO MODERNO -->
        <footer class="chat-input-wrapper">
            <div class="chat-input-box">
                <textarea 
                    id="userInput" 
                    placeholder="Escribe tu consulta o ingresa tu DNI para revisar tu servicio..." 
                    rows="1"
                ></textarea>
                <button id="sendButton" title="Enviar mensaje">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <p class="disclaimer">Asistente impulsado por IA. Para consultas de tu línea ten a la mano tu DNI.</p>
        </footer>

    </main>

    <script src="./chat.js"></script>
</body>
</html>
