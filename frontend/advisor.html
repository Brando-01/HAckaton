<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Casos derivados | Movistar
  </title>

  <link
    rel="stylesheet"
    href="./advisor.css"
  >
</head>

<body>
  <header class="advisor-header">
    <div>
      <h1>Casos derivados</h1>

      <p>
        Vista simulada del asesor
        Movistar
      </p>
    </div>

    <button id="refreshButton">
      Actualizar
    </button>
  </header>

  <main class="advisor-layout">

    <section class="cases-panel">

      <h2>Casos derivados</h2>

      <div id="casesList">
        Cargando casos...
      </div>

    </section>

    <section
      class="detail-panel"
      id="caseDetail"
    >
      <div class="empty-state">
        Selecciona un caso para
        revisar el contexto.
      </div>
    </section>

  </main>

  <script src="./advisor.js"></script>
</body>
</html>
