<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Casos derivados | Movistar
  </title>

  <link
    rel="stylesheet"
    href="./advisor.css"
  >
  <link rel="stylesheet" href="./demo-nav.css">
</head>

<body>
  <header class="advisor-header">
    <div>
      <h1>Casos derivados</h1>

      <p>
        Vista simulada del asesor
        Movistar
      </p>
    </div>

    <div class="advisor-header-actions">
      <nav class="demo-nav" aria-label="Navegación de demo">
        <a class="demo-nav-link home-link" href="/">Inicio demo</a>
        <a class="demo-nav-link active" href="/advisor">Casos</a>
        <a class="demo-nav-link" href="/dashboard">Dashboard</a>
      </nav>

      <button id="refreshButton">
        Actualizar
      </button>
    </div>
  </header>

  <main class="advisor-layout">

    <section class="cases-panel">

      <h2>Casos derivados</h2>

      <div id="casesList">
        Cargando casos...
      </div>

    </section>

    <section
      class="detail-panel"
      id="caseDetail"
    >
      <div class="empty-state">
        Selecciona un caso para
        revisar el contexto.
      </div>
    </section>

  </main>

  <script src="./advisor.js"></script>
</body>
</html>
